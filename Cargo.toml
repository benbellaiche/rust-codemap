[package]
name = "cargo-codemap"
version = "0.1.0"
edition = "2021"
description = "Interactive call-graph viewer for Rust codebases, with execution replay from real tracing logs. Invoke as `cargo codemap`."

[[bin]]
name = "cargo-codemap"
path = "src/main.rs"

[dependencies]
dunce = "1"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
